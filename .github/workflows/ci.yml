name: CI

on:
  pull_request:
    branches: [master, "feat/**", "chore/**"]
  push:
    branches: [master, "feat/**", "chore/**"]
  workflow_dispatch:

# 取消同分支旧 run，节省 CI 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-contract:
    name: Desktop release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
          cache-dependency-path: backend/go/go.sum

      - name: Validate packaging scripts and config
        run: |
          bash -n scripts/build-python-runtime.sh scripts/ci-assemble.sh scripts/package-desktop.sh
          python3 -m json.tool backend/go/wails.json >/dev/null

      - name: Validate desktop release workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/release-desktop.yml

      - name: Verify updater asset contract
        working-directory: backend/go
        run: go test ./internal/updater ./internal/engineproc

  # ───────────────────── 1. Go lint + test ─────────────────────
  go:
    name: Go (backend/go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: backend/go/go.sum

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

  # ───────────────────── 2. Python smoke test ─────────────────────
  python:
    name: Python (backend/python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/python/requirements.txt

      - name: pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: syntax check
        run: |
          python -m compileall -q app/ || (echo "syntax errors above" && exit 1)

      - name: pytest
        run: pytest -q

  # ───────────────────── 3. Frontend lint + build ─────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      # 显式装 pnpm —— 不依赖 setup-node 的 cache
      # (setup-node cache: 'pnpm' 在 lockfileVersion 9 下有路径解析坑)
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: lint
        run: pnpm lint

      # 关键：必须能 build 通过 —— frontend 是输出产物
      - name: build
        env:
          NEXT_PUBLIC_API_BASE_URL: "https://api.example.com"
          NEXT_PUBLIC_WS_BASE_URL: "wss://api.example.com"
        run: pnpm build
