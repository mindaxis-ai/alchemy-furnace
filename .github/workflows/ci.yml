name: CI

on:
  pull_request:
    branches: [master, "feat/**", "chore/**"]
  push:
    branches: [master, "feat/**", "chore/**"]
  workflow_dispatch:

# 取消同分支旧 run，节省 CI 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-contract:
    name: Desktop release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
          cache-dependency-path: backend/go/go.sum

      - name: Validate packaging scripts and config
        run: |
          bash -n scripts/lib/*.sh scripts/*.sh scripts/tests/*.sh
          python3 -m json.tool backend/go/wails.json >/dev/null

      - name: Verify desktop visible-name contract
        run: bash scripts/tests/desktop-name-contract-test.sh

      - name: Run runtime contract tests
        run: bash scripts/tests/runtime-common-test.sh

      - name: Validate desktop release workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/release-desktop.yml .github/workflows/ci.yml

      - name: Verify updater asset contract
        working-directory: backend/go
        run: go test ./internal/updater ./internal/engineproc

  # ───────────────────── Windows 契约(PowerShell verifier)─────────────────────
  windows-contract:
    name: Windows release contract
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
          cache-dependency-path: backend/go/go.sum

      # 平台无关的 controller/assets 测试在 Linux go job 跑; 本步只在 Windows
      # 编译并运行 tray_windows_test.go(Shell_NotifyIconW 消息循环/菜单/任务栏重建)
      - name: Run Windows tray tests
        working-directory: backend/go
        run: go test ./internal/desktoptray -count=1

      # verify-windows-package.ps1 的 Pester 测试只能在 Windows runner 跑(PE 头解析);
      # windows-2022 镜像缺 Pester 5 时就地安装;真实包契约由 release workflow 的
      # ci-assemble 调用覆盖,本 job 负责回归单测
      - name: Run PowerShell verifier tests (Pester)
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable -Name Pester |
            Where-Object { $_.Version -ge [version]'5.0.0' } | Select-Object -First 1
          if (-not $pester) {
            Write-Host "未发现 Pester 5,就地安装"
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0
          }
          $result = Invoke-Pester -Path scripts/tests/verify-windows-package.Tests.ps1 -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
            throw "Pester 失败: $($result.FailedCount) 个用例未通过"
          }

  # ───────────────────── 1. Go lint + test ─────────────────────
  go:
    name: Go (backend/go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
          cache: true
          cache-dependency-path: backend/go/go.sum

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        # 平台无关测试全部由 ./... 覆盖: desktoptray controller/assets(无 build tag)
        # + cmd/desktop 生命周期状态机。平台相关测试按 build tag 分流:
        # tray_windows_test.go → windows-contract job; tray_darwin_test.go(cgo 桥)
        # → release-desktop 的 macOS matrix
        run: go test ./... -count=1

  # ───────────────────── 2. Python smoke test ─────────────────────
  python:
    name: Python (backend/python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/python/requirements.txt

      - name: pip install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: syntax check
        run: |
          python -m compileall -q app/ || (echo "syntax errors above" && exit 1)

      - name: pytest
        run: pytest -q

  # ───────────────────── 3. Frontend lint + build ─────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      # 显式装 pnpm —— 不依赖 setup-node 的 cache
      # (setup-node cache: 'pnpm' 在 lockfileVersion 9 下有路径解析坑)
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: lint
        run: pnpm lint

      # 关键：必须能 build 通过 —— frontend 是输出产物
      - name: build
        env:
          NEXT_PUBLIC_API_BASE_URL: "https://api.example.com"
          NEXT_PUBLIC_WS_BASE_URL: "wss://api.example.com"
        run: pnpm build
