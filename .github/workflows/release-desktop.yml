name: Release desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic-version tag to release (vX.Y.Z)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Existing semantic-version tag to release (vX.Y.Z)"
        required: true
        type: string
    secrets:
      MACOS_SIGN_IDENTITY:
        description: "Optional signing identity already installed on each macOS runner"
        required: false

concurrency:
  group: release-desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        name: Resolve semantic version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a semantic-version tag (vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build embedded frontend
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build static export
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Stage embedded assets
        run: |
          rm -rf backend/go/internal/webui/out
          cp -R frontend/out backend/go/internal/webui/out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-webui
          path: backend/go/internal/webui/out
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package ${{ matrix.platform }}
    needs: [prepare, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            wails_platform: darwin/arm64
          - os: macos-15-intel
            platform: darwin-amd64
            wails_platform: darwin/amd64
          - os: windows-2022
            platform: windows-amd64
            wails_platform: windows/amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
          cache-dependency-path: backend/go/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: desktop-webui
          path: backend/go/internal/webui/out

      - name: Restore target Python runtime
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: backend/go/dist-runtime
          key: desktop-runtime-v2-${{ matrix.platform }}-${{ hashFiles('scripts/build-python-runtime.sh', 'backend/python/requirements.txt', 'backend/python/app/**/*.py') }}

      - name: Build target Python runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-python-runtime.sh ${{ matrix.platform }} backend/go/dist-runtime

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Wails application
        working-directory: backend/go
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          wails build -clean -platform "${{ matrix.wails_platform }}" \
            -ldflags "-X github.com/alchemy-furnace/server/internal/buildinfo.Version=${RELEASE_TAG} -X github.com/alchemy-furnace/server/internal/buildinfo.Commit=${RELEASE_SHA} -X github.com/alchemy-furnace/server/internal/buildinfo.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X github.com/alchemy-furnace/server/internal/buildinfo.UpdateRepo=${RELEASE_REPOSITORY}" \
            -skipbindings

      - name: Assemble release package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
        run: ./scripts/ci-assemble.sh ${{ matrix.platform }} "${{ needs.prepare.outputs.tag }}"

      - name: Verify macOS package layout
        if: runner.os == 'macOS'
        run: |
          app=backend/go/build/bin/AlchemyFurnace.app
          test -x "$app/Contents/MacOS/AlchemyFurnace"
          test -x "$app/Contents/Resources/python-runtime/bin/python3"
          test -f "$app/Contents/Resources/python-runtime/engine/app/main.py"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = "iconfile"
          test -s "$app/Contents/Resources/iconfile.icns"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Verify Windows package layout
        if: runner.os == 'Windows'
        run: |
          test -f backend/go/build/package/windows/AlchemyFurnace.exe
          test -f backend/go/build/package/windows/runtime/python.exe
          test -f backend/go/build/package/windows/runtime/engine/app/main.py
          test -s backend/go/build/dist/AlchemyFurnace-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: backend/go/build/dist/AlchemyFurnace-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Verify release asset contract
        run: |
          for asset in \
            AlchemyFurnace-mac-arm64.dmg \
            AlchemyFurnace-mac-arm64.zip \
            AlchemyFurnace-mac-x64.dmg \
            AlchemyFurnace-mac-x64.zip \
            AlchemyFurnace-Setup.exe; do
            test -s "dist/$asset" || { echo "::error::Missing $asset"; exit 1; }
          done
          (cd dist && sha256sum AlchemyFurnace-* > checksums.txt)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          body: |
            ## 桌面端安装

            - macOS Apple Silicon：下载 `AlchemyFurnace-mac-arm64.dmg`
            - macOS Intel：下载 `AlchemyFurnace-mac-x64.dmg`
            - Windows x64：下载 `AlchemyFurnace-Setup.exe`

            当前默认构建未经过 Apple 公证或商业代码签名。macOS 首次启动请右键应用并选择“打开”；Windows SmartScreen 提示时请选择“更多信息”后继续运行。
