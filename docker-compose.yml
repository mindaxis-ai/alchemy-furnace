version: "3.8"

services:
  # PostgreSQL - 业务数据库
  postgres:
    image: postgres:14-alpine
    container_name: alchemy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-alchemy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alchemy123}
      POSTGRES_DB: ${DB_NAME:-alchemy_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - alchemy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alchemy} -d ${DB_NAME:-alchemy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python 语言引擎 - 金丹合成核心
  python-engine:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    container_name: alchemy-python-engine
    restart: unless-stopped
    environment:
      - PYTHON_PORT=${PYTHON_PORT:-8000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-4o}
      - SYNTHESIS_MODEL=${SYNTHESIS_MODEL:-gpt-4o-mini}
    ports:
      - "${PYTHON_PORT:-8000}:8000"
    networks:
      - alchemy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Go API 网关
  go-api:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
    container_name: alchemy-go-api
    restart: unless-stopped
    environment:
      - GO_PORT=${GO_PORT:-8080}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-alchemy}
      - DB_PASSWORD=${DB_PASSWORD:-alchemy123}
      - DB_NAME=${DB_NAME:-alchemy_db}
      - PYTHON_ENGINE_BASE_URL=http://python-engine:8000
    ports:
      - "${GO_PORT:-8080}:8080"
    networks:
      - alchemy-network
    depends_on:
      postgres:
        condition: service_healthy
      python-engine:
        condition: service_healthy

  # Nginx - 反向代理 + 静态文件
  nginx:
    image: nginx:alpine
    container_name: alchemy-nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - alchemy-network
    depends_on:
      - go-api
      - python-engine

  # Frontend Builder - 构建前端静态文件
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: alchemy-frontend-builder
    volumes:
      - frontend_dist:/app/dist
    networks:
      - alchemy-network
    profiles:
      - build

volumes:
  postgres_data:
    driver: local
  frontend_dist:
    driver: local

networks:
  alchemy-network:
    driver: bridge
    name: alchemy-network
